<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>I Love You</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', 'Palatino', serif;
            background-color: black;
            color: #ffdddd;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.7);
            pointer-events: none;
            z-index: 2;
        }
        .button-wrapper {
            position: fixed;
            bottom: 10%;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }
        .fantasy-btn {
            pointer-events: auto;
            padding: 10px 28px;
            background: #2a1a1a;
            border: 1px solid #6d4c4c;
            border-radius: 40px;
            color: #e6cbcb;
            font-size: 1.2rem;
            font-weight: normal;
            letter-spacing: 4px;
            text-shadow: 0 0 6px #6d2a2a;
            box-shadow: 0 0 12px rgba(80, 20, 20, 0.5), inset 0 0 6px #4c2a2a;
            font-family: 'Georgia', 'Cinzel', serif;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(2px);
            border-style: solid;
            border-width: 1px;
            opacity: 0.85;
            transform: scale(1);
        }
        .fantasy-btn:hover {
            transform: scale(1.02);
            background: #2f1e1e;
            border-color: #8a5a5a;
            box-shadow: 0 0 18px rgba(100, 40, 40, 0.6);
            color: #f0dfdf;
            letter-spacing: 5px;
            opacity: 0.95;
        }
        .message-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 650px;
            background: rgba(15, 5, 20, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 100, 150, 0.5);
            border-radius: 40px 10px 40px 10px;
            box-shadow: 0 0 60px rgba(120, 30, 60, 0.6), inset 0 0 30px rgba(100, 20, 30, 0.3);
            padding: 2.5rem 2rem;
            z-index: 30;
            color: #ffe4e1;
            font-size: 1.6rem;
            text-align: center;
            font-family: 'Palatino', 'Georgia', 'Cinzel', serif;
            word-wrap: break-word;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .message-text {
            font-size: 1.9rem;
            line-height: 1.4;
            margin-bottom: 30px;
            text-shadow: 0 0 8px #aa4466, 0 0 16px #661122;
            letter-spacing: 2px;
            border-bottom: 1px dashed #aa7a7a;
            padding-bottom: 20px;
            width: 100%;
        }
        .close-btn {
            background: rgba(30, 10, 15, 0.7);
            border: 1px solid #b07a7a;
            color: #ffdddd;
            font-size: 1.2rem;
            padding: 8px 26px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: normal;
            text-shadow: 0 0 5px #661122;
            box-shadow: 0 0 10px rgba(100, 40, 40, 0.4);
            transition: 0.2s;
            font-family: 'Georgia', serif;
            letter-spacing: 3px;
        }
        .close-btn:hover {
            background: #3a2222;
            border-color: #c08a8a;
            box-shadow: 0 0 18px #8a4a4a;
        }
        .sigil {
            position: fixed;
            top: 20px;
            right: 30px;
            color: rgba(200, 150, 150, 0.25);
            font-size: 1.0rem;
            z-index: 5;
            font-family: 'Cinzel', serif;
            pointer-events: none;
        }
        @media (max-width: 600px) {
            .fantasy-btn {
                font-size: 1.0rem;
                padding: 8px 20px;
                letter-spacing: 3px;
            }
            .message-modal {
                width: 85%;
                padding: 1.8rem;
                font-size: 1.3rem;
            }
            .message-text {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="vignette"></div>
    <div class="sigil">⚜  ❤  ⚜</div>

    <div class="button-wrapper">
        <button id="openMessageBtn" class="fantasy-btn">открыть</button>
    </div>

    <div id="messageModal" class="message-modal">
        <div id="messageText" class="message-text">
            ✦ С днем святого Влентина<br>ты значишь для меня многое ✦
        </div>
        <button id="closeModalBtn" class="close-btn">✧ закрыть ✧</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 28);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.6;
        controls.enableZoom = true;
        controls.zoomSpeed = 0.5;
        controls.enablePan = false;
        controls.enableRotate = true;
        controls.rotateSpeed = 0.4;

        const frontLight = new THREE.PointLight(0xcc4466, 0.9, 40);
        frontLight.position.set(2, 2, 15);
        scene.add(frontLight);
        
        const leftLight = new THREE.PointLight(0x8866aa, 0.5);
        leftLight.position.set(-15, 0, 5);
        scene.add(leftLight);
        
        const rightLight = new THREE.PointLight(0xaa6688, 0.5);
        rightLight.position.set(15, 0, 10);
        scene.add(rightLight);
        
        const backLight = new THREE.PointLight(0x662233, 0.6);
        backLight.position.set(0, 0, -20);
        scene.add(backLight);
        
        const ambient = new THREE.AmbientLight(0x352a2a);
        scene.add(ambient);

        scene.fog = new THREE.FogExp2(0x050510, 0.025);

        const particleCount = 1400;
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const scale = 0.45;
        const offsetY = 0.5;
        
        for (let i = 0; i < particleCount; i++) {
            const t = Math.random() * Math.PI * 2;
            
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            let z = 0;
            
            const thickness = (Math.random() * 3.2 - 1.6);
            z = (Math.sin(t * 2) * 1.5) + thickness * 1.2;
            
            x += (Math.random() - 0.5) * 1.0;
            y += (Math.random() - 0.5) * 1.0;
            
            positions[i * 3] = x * scale * 0.9;
            positions[i * 3 + 1] = y * scale * 0.9 + offsetY;
            positions[i * 3 + 2] = z * scale * 1.6;
            
            if (Math.random() < 0.1) {
                colors[i * 3] = 1.0; colors[i*3+1] = 0.5; colors[i*3+2] = 0.2;
            } else {
                colors[i * 3] = 0.85 + Math.random() * 0.35;
                colors[i * 3 + 1] = 0.1 + Math.random() * 0.2;
                colors[i * 3 + 2] = 0.15 + Math.random() * 0.25;
            }
        }

        const particleGeometry = new THREE.BufferGeometry();
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 140, 140, 1)');
            gradient.addColorStop(0.5, 'rgba(160, 40, 40, 0.8)');
            gradient.addColorStop(1, 'rgba(60, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        const particleMaterial = new THREE.PointsMaterial({
            size: 0.4,
            map: createParticleTexture(),
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            sizeAttenuation: true,
            opacity: 0.9
        });

        const heartParticles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(heartParticles);

        const extraParticlesGeo = new THREE.BufferGeometry();
        const extraCount = 700;
        const extraPos = new Float32Array(extraCount * 3);
        const extraCol = new Float32Array(extraCount * 3);
        for (let i = 0; i < extraCount; i++) {
            const rad = 6 + Math.random() * 10;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            
            const x = Math.sin(phi) * Math.cos(theta) * rad;
            const y = Math.sin(phi) * Math.sin(theta) * rad * 0.7;
            const z = Math.cos(phi) * rad;
            
            extraPos[i * 3] = x * 0.9;
            extraPos[i * 3 + 1] = y * 0.6 + 1;
            extraPos[i * 3 + 2] = z * 0.8;
            
            const choice = Math.random();
            if (choice < 0.4) {
                extraCol[i*3]=0.9; extraCol[i*3+1]=0.3; extraCol[i*3+2]=0.4;
            } else if (choice < 0.7) {
                extraCol[i*3]=0.7; extraCol[i*3+1]=0.5; extraCol[i*3+2]=0.2;
            } else {
                extraCol[i*3]=0.4; extraCol[i*3+1]=0.5; extraCol[i*3+2]=0.9;
            }
        }
        extraParticlesGeo.setAttribute('position', new THREE.BufferAttribute(extraPos, 3));
        extraParticlesGeo.setAttribute('color', new THREE.BufferAttribute(extraCol, 3));
        const extraMaterial = new THREE.PointsMaterial({
            size: 0.24,
            map: createParticleTexture(),
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            sizeAttenuation: true,
            opacity: 0.3
        });
        const extraParticles = new THREE.Points(extraParticlesGeo, extraMaterial);
        scene.add(extraParticles);

        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 1000;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            starsPos[i*3] = (Math.random() - 0.5) * 200;
            starsPos[i*3+1] = (Math.random() - 0.5) * 200;
            starsPos[i*3+2] = (Math.random() - 0.5) * 200 - 100;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0xaa99aa,
            size: 0.25,
            transparent: true,
            blending: THREE.AdditiveBlending,
            sizeAttenuation: false
        });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            extraParticles.rotation.y += 0.0002;
            extraParticles.rotation.x += 0.0001;
            stars.rotation.y += 0.0001;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        const modal = document.getElementById('messageModal');
        const openBtn = document.getElementById('openMessageBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        
        const messageTextElement = document.getElementById('messageText');
        
        openBtn.addEventListener('click', () => {
            modal.style.display = 'flex';
        });
        
        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });
        
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.style.display === 'flex') {
                modal.style.display = 'none';
            }
        });

        modal.style.display = 'none';
        
        let time = 0;
        setInterval(() => {
            time += 0.1;
            heartParticles.material.size = 0.4 + Math.sin(time) * 0.04;
        }, 100);
    </script>
</body>
</html>
